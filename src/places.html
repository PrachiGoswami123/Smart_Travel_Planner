<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Places - Smart Travel Planner</title>

    <!-- Tailwind output file -->
    <link rel="stylesheet" href="./output.css" />

    <!-- Favicon -->
    <link
      rel="icon"
      href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS0ku_JAxG2yYPtQ1m3e0XNY3vaw5bL8IhHBg&s"
    />
  </head>

  <!-- BODY -->
  <body class="bg-gradient-to-br from-green-100 to-green-400 min-h-screen">

    <!-- NAVBAR -->
    <nav class="bg-white shadow-md">
      <div class="max-w-6xl mx-auto px-4">
        <div class="flex justify-between items-center h-16">
          <div class="text-xl font-bold text-blue-600">SmartTravel</div>

          <div class="hidden md:flex space-x-6">
            <a href="home.html" class="text-gray-700 hover:text-blue-600">Home</a>
            <a href="destination.html" class="text-gray-700 hover:text-blue-600">Destination</a>
            <a href="weather.html" class="text-gray-700 hover:text-blue-600">Weather</a>
            <a href="places.html" class="text-gray-700 hover:text-blue-600 font-semibold">
              Places
            </a>
            <a href="budget.html" class="text-gray-700 hover:text-blue-600">Budget</a>
          </div>
        </div>
      </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="max-w-6xl mx-auto mt-16 px-4">

      <h1 class="text-3xl font-bold text-center text-green-700 mb-2">
        Tourist Places
      </h1>

      <h2 id="cityName" class="text-center text-gray-700 mb-6 text-lg"></h2>

      <!-- LOADING -->
      <p
        id="loading"
        class="text-gray-600 animate-pulse text-center text-xl mb-6"
      >
        Loading Places...
      </p>

      <!-- ERROR -->
      <p
        id="error"
        class="hidden text-center text-red-700 font-semibold text-lg mb-6"
      >
        ❌ Places Not Found
      </p>

      <!-- PLACES GRID -->
      <div
        id="placesBox"
        class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
      ></div>

    </main>

    <!-- SCRIPT -->
    <script src="./js/places.js"></script>

  </body>
</html>
