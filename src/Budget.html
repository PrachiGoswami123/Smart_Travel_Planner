<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Travel - Budget Planner</title>

  <link rel="stylesheet" href="./output.css">
</head>

<body class="bg-gray-100">

  <!-- Navbar -->
  <nav class="bg-white shadow-md">
    <div class="max-w-7xl mx-auto px-6">
      <div class="flex justify-between items-center h-16">
        <h1 class="text-xl font-bold text-blue-600">SmartTravel</h1>

        <div class="hidden md:flex space-x-6">
          <a href="home.html" class="text-gray-700 hover:text-blue-600">Home</a>
          <a href="destination.html" class="text-gray-700 hover:text-blue-600">Destination</a>
          <a href="weather.html" class="text-gray-700 hover:text-blue-600">Weather</a>
          <a href="places.html" class="text-gray-700 hover:text-blue-600">Places</a>
          <a href="budget.html" class="text-blue-600 font-semibold">Budget</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Budget Section -->
  <section class="max-w-6xl mx-auto mt-10 bg-white shadow-md rounded-lg p-8">
    
    <h2 class="text-center text-2xl font-semibold text-gray-800 mb-6">
      💰 Travel Budget Planner
    </h2>

    <!-- Inputs -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <input 
        type="text" 
        id="city"
        placeholder="City Name"
        class="border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-400"
      />

      <input 
        type="number" 
        id="days"
        placeholder="Days"
        class="border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-400"
      />

      <input 
        type="number" 
        id="people"
        placeholder="People"
        class="border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-400"
      />
    </div>

    <!-- Button -->
    <div class="mt-6">
      <button 
        onclick="calculateBudget()"
        class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-md transition">
        Calculate Budget
      </button>
    </div>

    <!-- Result -->
    <div class="mt-6 text-center">
      <p id="result" class="text-lg font-semibold"></p>
    </div>

  </section>

  <!-- Extra UI Box -->
  <section class="max-w-6xl mx-auto mt-6 p-6 bg-green-100 rounded-lg shadow-md text-center">
    <h3 class="text-xl font-bold text-green-700 mb-2">💡 Travel Tip</h3>
    <p class="text-gray-700">
      Plan your trip smartly by balancing hotel, food and transport expenses.
    </p>
  </section>

  <!-- JS -->
  <script src="./js/budget.js"></script>

</body>
</html>
